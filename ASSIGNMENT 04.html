  <h1><u>My Flexbox Photo Gallery</u></h1>

  <div></div>

  <div></div>

<div class="wrapper">
 
  <div class="controls">
    <input type="radio" name="align" id="center" checked>
    <input type="radio" name="align" id="left">
    
    <input type="radio" name="align" id="right">
    <input type="radio" name="align" id="between">
    <input type="radio" name="align" id="around">

    <label for="left">Left</label>
    <label for="center">Center</label>
    <label for="right">Right</label>
    <label for="between">Space Between</label>
    <label for="around">Space Around</label>
  </div>

  <div class="nojs-controls">
  
  

 
  <input type="radio" name="layout" id="layoutRow" class="hidden-toggle" checked>
  <input type="radio" name="layout" id="layoutCol" class="hidden-toggle">
  <label for="layoutRow" class="btn">Row</label>
  <label for="layoutCol" class="btn">Column</label>

  
  <span class="label"></span>
  <input type="radio" name="perrow" id="per1" class="hidden-toggle">
  <input type="radio" name="perrow" id="per2" class="hidden-toggle">
  
  <label for="per1" class="btn">1</label>
  <label for="per2" class="btn">2</label>
  


  <span class="label">Size:</span>
  <input type="radio" name="size" id="sizeS" class="hidden-toggle" checked>
  <input type="radio" name="size" id="sizeM" class="hidden-toggle" >
  <input type="radio" name="size" id="sizeL" class="hidden-toggle">
  <label for="sizeS" class="btn">Small</label>
  <label for="sizeM" class="btn">Medium</label>
  <label for="sizeL" class="btn">Large</label>
